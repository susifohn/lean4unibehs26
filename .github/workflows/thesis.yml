name: Thesis PDF

on:
  push:
    branches: [main]
    paths:
      - "thesis/**"
      - ".github/workflows/thesis.yml"
  pull_request:
    paths:
      - "thesis/**"
  workflow_dispatch:

concurrency:
  group: thesis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-thesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: document.tex
          working_directory: thesis/


      - name: Convert to HTML (TeX4ht)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: document.tex
          working_directory: thesis/
          compiler: make4ht
          args: "-u -f html5 -d html"

      - name: Prepare site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp thesis/document.pdf site/thesis.pdf
          cp -r thesis/html/* site/ || true
          cp site/document.html site/thesis.html || true

      - name: Create index page
        if: github.ref == 'refs/heads/main'
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Thesis</title>
          <style>body{font-family:sans-serif;max-width:30rem;margin:3rem auto;padding:0 1rem}
          a{display:block;margin:1rem 0;font-size:1.2rem}</style>
          </head><body>
          <h1>Thesis</h1>
          <a href="thesis.pdf">PDF version</a>
          <a href="thesis.html">Web version (phone-friendly)</a>
          </body></html>
          EOF

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-thesis
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4