name: Thesis PDF

on:
  push:
    branches: [main]
    paths:
      - "thesis/**"
      - ".github/workflows/thesis.yml"
    tags:
      - "thesis-v*"
  pull_request:
    paths:
      - "thesis/**"
  workflow_dispatch:

concurrency:
  group: thesis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-thesis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: thesis/
          # texlive_version: 2025   # pin after the first successful build
          # latexmk_use_lualatex: true
          # latexmk_shell_escape: true
          # extra_system_packages: "python3-pygments"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis/main.pdf

      - name: Attach PDF to release
        if: startsWith(github.ref, 'refs/tags/thesis-v')
        uses: softprops/action-gh-release@v2
        with:
          files: thesis/main.pdf